<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 340" width="1360" height="340" font-family="Times New Roman, Times, serif">
  <title>BOT 6-stage pipeline</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c5d68"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1360" height="340" rx="14" fill="#ffffff" stroke="#d8d3c8"/>

  <text x="680" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1d2430">BOT: 6-stage pipeline (run one stage, or Run all)</text>

  <g font-size="13" text-anchor="middle">
    <g>
      <rect x="24" y="56" width="200" height="132" rx="10" fill="#f4f8f8" stroke="#2c5d68" stroke-width="2"/>
      <text x="124" y="82" font-size="15" font-weight="700" fill="#244a54">1. Business Analyst</text>
      <text x="124" y="108" fill="#3a424c">In: requirement + domain</text>
      <text x="124" y="126" fill="#3a424c">Stories and acceptance</text>
      <text x="124" y="158" font-weight="600" fill="#166534">Out: user stories</text>
    </g>
    <g>
      <rect x="248" y="56" width="200" height="132" rx="10" fill="#f4f8f8" stroke="#2c5d68" stroke-width="2"/>
      <text x="348" y="82" font-size="15" font-weight="700" fill="#244a54">2. Developer</text>
      <text x="348" y="108" fill="#3a424c">In: user stories</text>
      <text x="348" y="126" fill="#3a424c">Any language, with comments</text>
      <text x="348" y="158" font-weight="600" fill="#166534">Out: source code</text>
    </g>
    <g>
      <rect x="472" y="56" width="200" height="132" rx="10" fill="#f4f8f8" stroke="#2c5d68" stroke-width="2"/>
      <text x="572" y="82" font-size="15" font-weight="700" fill="#244a54">3. Tester</text>
      <text x="572" y="108" fill="#3a424c">In: source code</text>
      <text x="572" y="126" fill="#3a424c">Unit, automation, manual</text>
      <text x="572" y="158" font-weight="600" fill="#166534">Out: tests</text>
    </g>
    <g>
      <rect x="696" y="56" width="200" height="132" rx="10" fill="#f4f8f8" stroke="#2c5d68" stroke-width="2"/>
      <text x="796" y="82" font-size="15" font-weight="700" fill="#244a54">4. Data Analyst</text>
      <text x="796" y="108" fill="#3a424c">In: code + tests</text>
      <text x="796" y="126" fill="#3a424c">KPIs, PNG / SVG charts</text>
      <text x="796" y="158" font-weight="600" fill="#166534">Out: dashboard</text>
    </g>
    <g>
      <rect x="920" y="56" width="200" height="132" rx="10" fill="#f4f8f8" stroke="#2c5d68" stroke-width="2"/>
      <text x="1020" y="82" font-size="15" font-weight="700" fill="#244a54">5. Deploy</text>
      <text x="1020" y="108" fill="#3a424c">In: application code</text>
      <text x="1020" y="126" fill="#3a424c">Docker, CI/CD, Kubernetes</text>
      <text x="1020" y="158" font-weight="600" fill="#166534">Out: DEPLOY.md</text>
    </g>
    <g>
      <rect x="1144" y="56" width="192" height="132" rx="10" fill="#fff8ee" stroke="#b45309" stroke-width="2"/>
      <text x="1240" y="82" font-size="15" font-weight="700" fill="#7c2d12">6. Trainer</text>
      <text x="1240" y="108" fill="#3a424c">In: approved outputs</text>
      <text x="1240" y="126" fill="#3a424c">Learns from your reviews</text>
      <text x="1240" y="158" font-weight="600" fill="#166534">Out: training store</text>
    </g>
  </g>

  <g stroke="#2c5d68" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="225" y1="122" x2="246" y2="122"/>
    <line x1="449" y1="122" x2="470" y2="122"/>
    <line x1="673" y1="122" x2="694" y2="122"/>
    <line x1="897" y1="122" x2="918" y2="122"/>
    <line x1="1121" y1="122" x2="1142" y2="122"/>
  </g>

  <path d="M1240 192 L1240 258 L124 258 L124 192" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowDash)"/>
  <text x="680" y="250" text-anchor="middle" font-size="13" font-style="italic" fill="#92400e">feedback loop: approved examples improve the next run of every stage</text>

  <text x="680" y="312" text-anchor="middle" font-size="12" fill="#5b6570">Pages: /  ·  /convert  ·  /stages    ·    Converter and Stage bots requests are saved in Previous results</text>
</svg>
