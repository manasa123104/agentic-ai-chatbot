server:
  port: ${PORT:8080}

spring:
  application:
    name: bot
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 250MB

agentic:
  # true behind a hosting proxy (Hugging Face Space): every request counts as a remote visitor
  public-mode: ${PUBLIC_MODE:false}
  output-dir: generated-app
  history-file: data/chat-history.json
  training-file: data/bot-training.json
  llm:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    enabled: ${LLM_ENABLED:true}
    # Free Google Gemini through its OpenAI-compatible endpoint; used first when GEMINI_API_KEY is set
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  converter:
    ollama:
      enabled: ${CONVERTER_OLLAMA_ENABLED:true}
      url: ${OLLAMA_URL:http://localhost:11434}
      # Blank picks the largest installed coding model automatically (e.g. qwen2.5-coder:7b)
      model: ${CONVERTER_MODEL:}
      timeout-minutes: ${CONVERTER_TIMEOUT_MINUTES:15}
    # Large files are split into parts of about this many characters, each converted separately and joined
    chunk-chars: ${CONVERTER_CHUNK_CHARS:4000}
    # Project / repository conversion jobs (input, output and job.json for each run)
    jobs-dir: data/conversion-jobs
    max-files: ${CONVERTER_MAX_FILES:300}
    max-file-kb: ${CONVERTER_MAX_FILE_KB:2048}
    # Allow converting a folder path on the machine running BOT
    allow-local-paths: ${CONVERTER_ALLOW_LOCAL_PATHS:true}
  github:
    # Optional token for cloning private repos and pushing; otherwise Git's own saved credentials are used
    token: ${GITHUB_TOKEN:}
  git:
    author-name: ${BOT_GIT_AUTHOR_NAME:BOT Code Converter}
    author-email: ${BOT_GIT_AUTHOR_EMAIL:bot-converter@users.noreply.github.com}
  # MCP JSON-RPC at POST /api/mcp (tools/list, tools/call) for agents / Cursor
  mcp:
    enabled: ${BOT_MCP_ENABLED:true}
    api-key: ${BOT_MCP_API_KEY:}
  # Always-on Guardrail for MCP tools and sensitive stage/push actions (not a seventh pipeline stage).
  # ENFORCE blocks, OBSERVE only logs.
  guardrail:
    enabled: ${BOT_GUARDRAIL_ENABLED:true}
    mode: ${BOT_GUARDRAIL_MODE:ENFORCE}
    allowed-repo-hosts:
      - github.com
    allowed-repos: []
    block-secrets: true
    block-dot-github-workflows: true
    require-https-remote: true
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}

logging:
  level:
    com.agentic: INFO
